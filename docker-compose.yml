# WhatsApp for Atendimento via Evolution API (unofficial, Baileys), on the machine that runs the API.
#   docker compose --env-file apps/api/.env up -d   → http://localhost:8085 (manager UI at /manager), this machine only
#   docker compose --env-file apps/api/.env down    → stops; `down -v` also wipes the WhatsApp sessions and Evolution's own database
# --env-file: the key comes from the API's own .env (EVOLUTION_API_KEY), so both always agree; without it compose refuses to start.
# The app's Postgres stays the one from the README; this Postgres is Evolution's internal store only.
name: cardapio-evolution # explicit, so it never mixes with another compose project named after the folder
services:
  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    depends_on: [evolution-db]
    # Loopback only: the API (same machine) is its only client; nothing on the LAN or behind the tunnel reaches it.
    ports: ["127.0.0.1:8085:8080"] # 8085 on the host: 8080 is a common dev port
    # Lets Evolution reach the API running on the host (WHATSAPP_WEBHOOK_URL=http://host.docker.internal:4100/...), Linux included.
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      SERVER_URL: http://localhost:8085
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?set EVOLUTION_API_KEY in apps/api/.env (openssl rand -hex 32) and run docker compose --env-file apps/api/.env up -d}
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:evolution@evolution-db:5432/evolution?schema=evolution_api
      DATABASE_CONNECTION_CLIENT_NAME: cardapio_dev
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true" # Baileys re-reads sent messages to answer delivery retries
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      DEL_INSTANCE: "false"
      TELEMETRY_ENABLED: "false"
      LOG_LEVEL: ERROR,WARN,INFO
      # Name shown in the phone under "Aparelhos conectados".
      CONFIG_SESSION_PHONE_CLIENT: Pyro dev
    volumes: [evolution_instances:/evolution/instances]

  evolution-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment: { POSTGRES_USER: evolution, POSTGRES_PASSWORD: evolution, POSTGRES_DB: evolution }
    volumes: [evolution_db:/var/lib/postgresql/data]

volumes:
  evolution_instances:
  evolution_db:
