# Production on the VM (README "Deploy", docs/adr/0010-vm-com-docker-compose.md). deploy/deploy.sh runs it:
#   docker compose -f deploy/docker-compose.prod.yml up -d
# Variables: deploy/.env, outside git (template: deploy/.env.example). Compose reads it on its own (it sits next to this file).
# Only Caddy publishes ports (80, 443). The API and Evolution are reachable only on this project's network.
# Data that outlives the containers, in Docker named volumes (/var/lib/docker/volumes/cardapio_<name>/_data on the VM):
#   caddy_data           certificates, their keys and the ACME account
#   evolution_db         Evolution's store: its instances, the WhatsApp sessions (table Session) and messages
#   evolution_instances  Evolution's per-instance files
# The app's data is in Supabase; its daily dump lands in deploy/backups (the backup service below), and a daily copy of the
# Storage buckets in deploy/backups/storage (storage-backup).
name: cardapio
# Every container's log, capped: Docker's json-file grows without end on the VM's disk otherwise (Evolution logs each message).
x-logging: &logging
  driver: json-file
  options: { max-size: 10m, max-file: "5" }

services:
  # Caddy 2.11.4 with the cardápio and the dashboard built in (deploy/caddy.Dockerfile), built here like the API.
  caddy:
    build:
      context: ..
      dockerfile: deploy/caddy.Dockerfile
      # The tables' QR codes, built into the dashboard, point at it.
      args: { PUBLIC_URL: "${PUBLIC_URL:?set PUBLIC_URL in deploy/.env (https://<the VM's public IPv4>)}" }
    image: cardapio-caddy
    restart: unless-stopped
    logging: *logging
    ports: ["80:80", "443:443"]
    environment:
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL in deploy/.env (https://<the VM's public IPv4>)}
      CADDY_TLS: ${CADDY_TLS:-letsencrypt}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    # Fixed, so the API can trust it alone with the client's IP (TRUSTED_PROXY below).
    networks: { default: { ipv4_address: 172.30.0.2 } }

  api:
    build: { context: .., dockerfile: apps/api/Dockerfile }
    image: cardapio-api
    restart: unless-stopped
    logging: *logging
    init: true # PID 1 that forwards SIGTERM, so `up -d` stops the old container at once
    env_file: .env
    # Wiring of this stack, not settings: they win over deploy/.env.
    environment:
      HOST: 0.0.0.0
      PORT: "4100"
      TRUSTED_PROXY: 172.30.0.2
      EVOLUTION_API_URL: http://evolution:8080
      WHATSAPP_WEBHOOK_URL: http://api:4100/api/whatsapp/webhook
      # The fronts' origin (Caddy serves them and the API on PUBLIC_URL) and the dashboard's inside the APK.
      CORS_ORIGINS: ${PUBLIC_URL},https://localhost
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/api/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Same as docker-compose.yml (dev), without the published port.
  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    logging: *logging
    depends_on: [evolution-db]
    environment:
      SERVER_URL: http://evolution:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?set EVOLUTION_API_KEY in deploy/.env (openssl rand -hex 32)}
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:evolution@evolution-db:5432/evolution?schema=evolution_api
      DATABASE_CONNECTION_CLIENT_NAME: cardapio_prod
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true" # Baileys re-reads sent messages to answer delivery retries
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      DEL_INSTANCE: "false"
      TELEMETRY_ENABLED: "false"
      LOG_LEVEL: ERROR,WARN,INFO
      # Name shown in the phone under "Aparelhos conectados".
      CONFIG_SESSION_PHONE_CLIENT: Pyro
    volumes: [evolution_instances:/evolution/instances]

  # Evolution's internal store only (no published port; the password never leaves this network).
  evolution-db:
    image: postgres:16.15-alpine3.24
    restart: unless-stopped
    logging: *logging
    environment: { POSTGRES_USER: evolution, POSTGRES_PASSWORD: evolution, POSTGRES_DB: evolution }
    volumes: [evolution_db:/var/lib/postgresql/data]

  # Daily dump of the app's database (Supabase, schema public) to deploy/backups on the VM's disk, keeping the last 7.
  # pg_dump 17 = Supabase's major. Custom format (-Fc: compressed, restored with pg_restore — README "Backup e restauração").
  # Every hour it checks for today's file (São Paulo date) and, after 04:00, dumps it if missing: a restart or a reboot never
  # skips a day, and the dump never runs during service.
  # Restore into an EMPTY database (a new Supabase project, or a scratch Postgres to check a dump), before any migration:
  #   docker compose -f deploy/docker-compose.prod.yml run --rm backup \
  #     pg_restore --schema=public --no-owner --no-privileges --exit-on-error --dbname='postgresql://…' /backups/cardapio-AAAA-MM-DD.dump
  # --schema=public restores what is inside the schema and not the schema itself, which every new database already has.
  backup:
    image: postgres:17.11-alpine3.24
    restart: unless-stopped
    logging: *logging
    environment:
      DIRECT_URL: ${DIRECT_URL:?set DIRECT_URL in deploy/.env}
      TZ: America/Sao_Paulo
    volumes: [./backups:/backups]
    command:
      - sh
      - -c
      - |
        umask 077 # the customers' names and phones are in there
        while true; do
          f=/backups/cardapio-$$(date +%F).dump
          if [ ! -s "$$f" ] && [ "$$(date +%H)" -ge 4 ]; then
            if pg_dump --format=custom --schema=public --no-owner --no-privileges --file="$$f.tmp" "$$DIRECT_URL"; then
              mv "$$f.tmp" "$$f" && echo "backup: $$f ($$(du -h "$$f" | cut -f1))"
              ls -1t /backups/cardapio-*.dump | tail -n +8 | xargs -r rm -f
            else
              rm -f "$$f.tmp"; echo "backup: pg_dump falhou, nova tentativa em 1 h" >&2
            fi
          fi
          sleep 3600
        done

  # Daily copy of the two Storage buckets (logo, capas e fotos dos pratos; fotos e áudios do WhatsApp) to deploy/backups/storage,
  # one folder per bucket, with the S3 keys the API already uses. Incremental: rclone copy only downloads what is new or changed
  # (same size and date = skipped), and never deletes here what was deleted there. Same schedule and permissions as the dump
  # above. Run once by hand, or restore: README "Backup e restauração".
  # ponytail: deleted objects stay here forever; prune deploy/backups/storage by hand if the VM's disk ever gets tight.
  storage-backup:
    image: rclone/rclone:1.75.1
    restart: unless-stopped
    logging: *logging
    environment:
      RCLONE_CONFIG: "" # no config file: the remote "supabase" is these variables
      RCLONE_CONFIG_SUPABASE_TYPE: s3
      RCLONE_CONFIG_SUPABASE_PROVIDER: Other
      RCLONE_CONFIG_SUPABASE_ENDPOINT: ${STORAGE_S3_ENDPOINT:?set STORAGE_S3_ENDPOINT in deploy/.env}
      RCLONE_CONFIG_SUPABASE_REGION: ${STORAGE_S3_REGION:?set STORAGE_S3_REGION in deploy/.env}
      RCLONE_CONFIG_SUPABASE_ACCESS_KEY_ID: ${STORAGE_S3_ACCESS_KEY_ID:?set STORAGE_S3_ACCESS_KEY_ID in deploy/.env}
      RCLONE_CONFIG_SUPABASE_SECRET_ACCESS_KEY: ${STORAGE_S3_SECRET_ACCESS_KEY:?set STORAGE_S3_SECRET_ACCESS_KEY in deploy/.env}
      RCLONE_CONFIG_SUPABASE_FORCE_PATH_STYLE: "true"
      BUCKETS: ${STORAGE_S3_BUCKET:?set STORAGE_S3_BUCKET in deploy/.env} ${STORAGE_S3_WHATSAPP_BUCKET:?set STORAGE_S3_WHATSAPP_BUCKET in deploy/.env}
      TZ: America/Sao_Paulo
    volumes: [./backups/storage:/backups]
    entrypoint: [sh, -c]
    command:
      - |
        umask 077 # the customers' WhatsApp photos and voice notes are in there
        while true; do
          today=$$(date +%F)
          if [ "$$(cat /backups/.ultima-copia 2>/dev/null)" != "$$today" ] && [ "$$(date +%H)" -ge 4 ]; then
            ok=1
            for b in $$BUCKETS; do rclone copy "supabase:$$b" "/backups/$$b" --use-server-modtime --log-level NOTICE || ok=0; done
            if [ "$$ok" = 1 ]; then
              echo "$$today" > /backups/.ultima-copia
              for b in $$BUCKETS; do echo "storage-backup: $$b, $$(find "/backups/$$b" -type f 2>/dev/null | wc -l) arquivos"; done
            else
              echo "storage-backup: a cópia falhou, nova tentativa em 1 h" >&2
            fi
          fi
          sleep 3600
        done

networks:
  default:
    # Other containers get addresses from the upper half only, so Caddy's fixed .2 is never handed out before it starts.
    ipam: { config: [{ subnet: 172.30.0.0/24, ip_range: 172.30.0.128/25 }] }

volumes:
  caddy_data:
  caddy_config:
  evolution_instances:
  evolution_db:
