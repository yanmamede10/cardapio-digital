name: Testes

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest # already has Docker (test Postgres) and Google Chrome (Playwright channel "chrome")
    timeout-minutes: 40 # the screen sweep (every screen × role × 3 sizes × 2 themes) and the production builds of csp.spec: ~20 min on 02/10/2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate --workspace apps/api
      - name: Typecheck
        run: npx tsc --noEmit -p apps/api/tsconfig.json && npx tsc --noEmit -p apps/dashboard/tsconfig.json
      - name: API + telas (Postgres descartável em Docker)
        run: npm test
      - name: Screenshots e traces das falhas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-falhas
          path: test-results/
          retention-days: 7
